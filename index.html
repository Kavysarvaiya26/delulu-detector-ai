<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delulu Detector AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #020617;
      padding: 25px;
      border-radius: 10px;
      width: 500px;
      max-height : 90vh;
      display: flex;
      flex-direction: column;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border-radius: 6px;
      border: none;
      resize: none;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #38bdf8;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #0ea5e9;
    }
    .output {
      margin-top: 15px;
      /* white-space: pre-wrap; */
      background: #1e293b;
      border: 1px solid #334155;
      padding: 15px;
      border-radius: 6px;
      height: 250px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🤖 Delulu Detector AI</h1>
  <p>Enter your goal and get a reality check.</p>

  <textarea id="goalInput" placeholder="e.g. I will master AI in 7 days"></textarea>
  <button onclick="detectDelulu()">Detect Delulu</button>

  <div class="output" id="outputBox">
    Output will appear here...
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  async function detectDelulu() {
    const goal = document.getElementById("goalInput").value;
    const outputBox = document.getElementById("outputBox");
    if (!goal) {
      alert("Please enter a goal!");
      return;
    }

    // Gemini response example)
    outputBox.innerHTML = 
"<em> Analyzing delulu levels...🤖</em>";
try{
    
      const response = await fetch('http://localhost:3000/detect-delulu', {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ goal })
      });
    const data = await response.json();
    outputBox.innerHTML = marked.parse(data.result);
  } catch(err){
    outputBox.innerText = "Error connecting to server.";
  }
  }
</script>
</body>
</html>
