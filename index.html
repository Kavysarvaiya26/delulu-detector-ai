<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delulu Detector AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #020617;
      padding: 25px;
      border-radius: 10px;
      width: 500px;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border-radius: 6px;
      border: none;
      resize: none;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #38bdf8;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #0ea5e9;
    }
    .output {
      margin-top: 15px;
      white-space: pre-wrap;
      background: #020617;
      border: 1px solid #1e293b;
      padding: 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🤖 Delulu Detector AI</h1>
  <p>Enter your goal and get a reality check.</p>

  <textarea id="goalInput" placeholder="e.g. I will master AI in 7 days"></textarea>
  <button onclick="detectDelulu()">Detect Delulu</button>

  <div class="output" id="outputBox">
    Output will appear here...
  </div>
</div>

<script>
  function detectDelulu() {
    const goal = document.getElementById("goalInput").value;

    if (!goal) {
      alert("Please enter a goal!");
      return;
    }

    // TEMPORARY DEMO OUTPUT (Gemini response example)
    document.getElementById("outputBox").innerText =
`🤖 Delulu Detector Analysis

1. Delulu Score: 95/100

2. Why this goal is unrealistic:
Mastering AI in 7 days is not feasible due to its vast complexity.

3. What part is realistic:
You can become familiar with basic AI concepts and tools.

4. Realistic Plan:
Day 1–2: Learn AI basics
Day 3–4: Practice simple ML models
Day 5–6: Explore NLP concepts
Day 7: Build a tiny project`;
  }
</script>

</body>
</html>
